name: Deploy terminal backends to production

on:
  push:
    branches: [main]
    paths:
      - MultipazTransitTerminal/**
      - MultipazWholesalePOS/**
      - .github/workflows/deploy-terminal-backends.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: utopia-multipaz
  GCP_ZONE: us-central1-c
  GCP_INSTANCE: utopia-multipaz-server
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/873069027544/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_DEPLOY_SERVICE_ACCOUNT: utopia-github-deployer@utopia-multipaz.iam.gserviceaccount.com
  ARTIFACT_REGISTRY_REPOSITORY: us-central1-docker.pkg.dev/utopia-multipaz/multipaz-images

jobs:
  deploy:
    name: Build and deploy Transit and POS backends
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out the deployment revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Gradle configures the Android modules while selecting either backend
      # task, so their signing properties must exist even though this workflow
      # builds only the backend Docker images.
      - name: Restore signing keystore for Gradle configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES_B64: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_B64 secret."; exit 1; }
          test -n "$KEYSTORE_PROPERTIES_B64" || { echo "Missing ANDROID_KEYSTORE_PROPERTIES_B64 secret."; exit 1; }
          mkdir -p keys
          printf '%s' "$KEYSTORE_B64" | base64 --decode > keys/keystore.jks
          printf '%s' "$KEYSTORE_PROPERTIES_B64" | base64 --decode > keys/keystore.properties
          chmod 600 keys/keystore.jks keys/keystore.properties

      - name: Build Linux AMD64 terminal images
        run: |
          set -euo pipefail
          (
            cd MultipazTransitTerminal
            ./gradlew :transitBackend:buildDockerImageAmd64 -PimageTag="$IMAGE_TAG"
          )
          (
            cd MultipazWholesalePOS
            ./gradlew :terminalBackend:buildDockerImageAmd64 -PimageTag="$IMAGE_TAG"
          )
          docker image inspect "multipaz-transit-terminal:$IMAGE_TAG" >/dev/null
          docker image inspect "multipaz-pos-terminal:$IMAGE_TAG" >/dev/null

      - name: Tag images with immutable Artifact Registry names
        id: images
        run: |
          set -euo pipefail
          transit_image="${ARTIFACT_REGISTRY_REPOSITORY}/transit-terminal:${IMAGE_TAG}"
          pos_image="${ARTIFACT_REGISTRY_REPOSITORY}/pos-terminal:${IMAGE_TAG}"
          docker tag "multipaz-transit-terminal:$IMAGE_TAG" "$transit_image"
          docker tag "multipaz-pos-terminal:$IMAGE_TAG" "$pos_image"
          printf 'transit=%s\n' "$transit_image" >> "$GITHUB_OUTPUT"
          printf 'pos=%s\n' "$pos_image" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Push immutable images to Artifact Registry
        env:
          TRANSIT_IMAGE: ${{ steps.images.outputs.transit }}
          POS_IMAGE: ${{ steps.images.outputs.pos }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker push "$TRANSIT_IMAGE"
          docker push "$POS_IMAGE"

      - name: Make VM space and preserve terminal rollback images
        run: |
          set -euo pipefail
          gcloud compute ssh "$GCP_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command='sudo bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          stack_dir=/opt/multipaz/stack
          env_file="$stack_dir/.env"
          rollback_env="$stack_dir/.env.terminal.rollback"
          cd "$stack_dir"
          test -f "$env_file"
          cp -p "$env_file" "$rollback_env"

          # Images used by the running terminal containers stay local for
          # rollback. Other immutable versions remain in Artifact Registry.
          docker image prune --all --force
          docker builder prune --all --force
          journalctl --vacuum-size=200M

          available_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
          if [ "$available_kib" -lt 1258291 ]; then
            echo "Need at least 1.2 GiB free on / before loading terminal images; have ${available_kib} KiB" >&2
            exit 1
          fi
          cp -a "$stack_dir" "${stack_dir}.bak-terminal-$(date -u +%Y%m%dT%H%M%SZ)"
          df -h /
          REMOTE_SCRIPT

      - name: Pull terminal images from Artifact Registry on the VM
        env:
          TRANSIT_IMAGE: ${{ steps.images.outputs.transit }}
          POS_IMAGE: ${{ steps.images.outputs.pos }}
        run: |
          set -euo pipefail
          gcloud compute ssh "$GCP_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -s -- '$TRANSIT_IMAGE' '$POS_IMAGE'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          transit_image="$1"
          pos_image="$2"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker pull "$transit_image"
          docker pull "$pos_image"
          REMOTE_SCRIPT

      - name: Activate terminal images and verify rollback path
        env:
          TRANSIT_IMAGE: ${{ steps.images.outputs.transit }}
          POS_IMAGE: ${{ steps.images.outputs.pos }}
        run: |
          set -euo pipefail
          gcloud compute ssh "$GCP_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -s -- '$TRANSIT_IMAGE' '$POS_IMAGE'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          transit_image="$1"
          pos_image="$2"
          stack_dir=/opt/multipaz/stack
          env_file="$stack_dir/.env"
          rollback_env="$stack_dir/.env.terminal.rollback"
          cd "$stack_dir"

          sed -i -E \
            "s|^TRANSIT_TERMINAL_IMAGE=.*|TRANSIT_TERMINAL_IMAGE=$transit_image|; s|^POS_TERMINAL_IMAGE=.*|POS_TERMINAL_IMAGE=$pos_image|" \
            "$env_file"
          if ! docker compose --project-directory "$stack_dir" up -d --force-recreate transit-terminal pos-terminal; then
            cp -p "$rollback_env" "$env_file"
            docker compose --project-directory "$stack_dir" up -d --force-recreate transit-terminal pos-terminal || true
            exit 1
          fi

          docker compose --project-directory "$stack_dir" ps transit-terminal pos-terminal
          grep -E '^(TRANSIT_TERMINAL_IMAGE|POS_TERMINAL_IMAGE)=' "$env_file"
          docker image prune --all --force
          docker builder prune --all --force
          df -h /
          REMOTE_SCRIPT

      - name: Verify public terminal routes
        run: |
          set -euo pipefail
          for path in /health /transit-terminal/ /pos-terminal/; do
            curl --fail --retry 12 --retry-all-errors --retry-delay 5 "https://utopia.multipaz.org$path" >/dev/null
          done
